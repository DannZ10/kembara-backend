# Backend stack — run from kembara-api/:  docker compose up --build
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gearnest_db
      MYSQL_ROOT_PASSWORD: gearnest_root
    ports:
      - "3307:3306"   # host 3307 avoids clashing with a local MySQL on 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pgearnest_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      # APP_KEY intentionally NOT set here: the entrypoint runs `key:generate`
      # into .env on first boot, keeping the key out of git. To pin one, add
      # `APP_KEY=base64:...` to a .env the container reads.
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: gearnest_db
      DB_USERNAME: root
      DB_PASSWORD: gearnest_root
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"
      SANCTUM_IDLE_TIMEOUT: "30"
      # Read from kembara-api/.env (gitignored) so keys stay out of this file.
      # Falls back to the offline placeholder when unset.
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-TESTKEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-SB-Mid-client-TESTKEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
    ports:
      - "8000:8000"

volumes:
  mysql_data:
